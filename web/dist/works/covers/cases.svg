<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#2a2418"/>
      <stop offset="55%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#0b0e13"/>
    </radialGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6f906f"/>
      <stop offset="100%" stop-color="#dbd3b5"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#glow)"/>

  <!-- 台账网格 -->
  <g stroke="#f4f1ea" stroke-opacity="0.05" stroke-width="1">
    <path d="M120 250 V950"/>
    <path d="M240 250 V950"/>
    <path d="M360 250 V950"/>
    <path d="M480 250 V950"/>
    <path d="M600 250 V950"/>
    <path d="M720 250 V950"/>
    <path d="M120 400 H780"/>
    <path d="M120 550 H780"/>
    <path d="M120 700 H780"/>
    <path d="M120 850 H780"/>
  </g>

  <!-- 柱状图：业务增长 -->
  <g>
    <rect x="150" y="700" width="52" height="250" fill="url(#bars)" fill-opacity="0.35"/>
    <rect x="232" y="620" width="52" height="330" fill="url(#bars)" fill-opacity="0.55"/>
    <rect x="314" y="660" width="52" height="290" fill="#f4f1ea" fill-opacity="0.30"/>
    <rect x="396" y="520" width="52" height="430" fill="url(#bars)" fill-opacity="0.8"/>
    <rect x="478" y="560" width="52" height="390" fill="#f4f1ea" fill-opacity="0.45"/>
    <rect x="560" y="420" width="52" height="530" fill="#ffd9b3" fill-opacity="0.85"/>
  </g>

  <!-- 上升箭头 -->
  <path d="M150 930 L720 300" fill="none" stroke="#ffd9b3" stroke-width="3" stroke-linecap="round"/>
  <path d="M720 300 L720 352 M720 300 L668 300" stroke="#ffd9b3" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="930" x2="150" y2="980" stroke="#ffd9b3" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- 报表纸页 -->
  <g transform="translate(600 780) rotate(-6)">
    <rect x="0" y="0" width="180" height="230" rx="4" fill="#0e1217" stroke="#f4f1ea" stroke-opacity="0.22" stroke-width="1.2"/>
    <line x1="20" y1="36" x2="160" y2="36" stroke="#f4f1ea" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="20" y1="62" x2="140" y2="62" stroke="#f4f1ea" stroke-opacity="0.18" stroke-width="1.4"/>
    <line x1="20" y1="86" x2="150" y2="86" stroke="#f4f1ea" stroke-opacity="0.18" stroke-width="1.4"/>
    <line x1="20" y1="110" x2="120" y2="110" stroke="#6f906f" stroke-opacity="0.55" stroke-width="1.4"/>
    <line x1="20" y1="134" x2="145" y2="134" stroke="#f4f1ea" stroke-opacity="0.18" stroke-width="1.4"/>
    <line x1="20" y1="158" x2="135" y2="158" stroke="#f4f1ea" stroke-opacity="0.18" stroke-width="1.4"/>
    <rect x="20" y="180" width="64" height="10" rx="2" fill="#ffd9b3" fill-opacity="0.5"/>
  </g>

  <!-- 幽灵编号 -->
  <text x="760" y="1090" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="300" font-weight="700" fill="#f4f1ea" fill-opacity="0.055">02</text>

  <!-- 发丝框 -->
  <rect x="36" y="36" width="828" height="1128" fill="none" stroke="#f4f1ea" stroke-opacity="0.16" stroke-width="1"/>
  <g stroke="#f4f1ea" stroke-opacity="0.6" stroke-width="2">
    <path d="M36 68 L68 36"/><path d="M864 68 L832 36"/>
    <path d="M36 1132 L68 1164"/><path d="M864 1132 L832 1164"/>
  </g>

  <rect width="900" height="1200" filter="url(#grain)"/>
</svg>
