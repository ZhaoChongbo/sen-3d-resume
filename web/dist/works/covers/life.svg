<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1f2b22"/>
      <stop offset="55%" stop-color="#13171a"/>
      <stop offset="100%" stop-color="#0b0e13"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbd3b5"/>
      <stop offset="100%" stop-color="#6f906f"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#glow)"/>

  <!-- 星与月 -->
  <g fill="#f4f1ea">
    <circle cx="150" cy="190" r="3" fill-opacity="0.5"/>
    <circle cx="280" cy="120" r="2" fill-opacity="0.35"/>
    <circle cx="560" cy="150" r="2.5" fill-opacity="0.4"/>
    <circle cx="700" cy="240" r="2" fill-opacity="0.3"/>
    <circle cx="420" cy="90" r="2" fill-opacity="0.45"/>
    <circle cx="810" cy="120" r="3" fill-opacity="0.35"/>
  </g>
  <circle cx="690" cy="360" r="120" fill="url(#moon)" fill-opacity="0.16"/>
  <circle cx="716" cy="336" r="120" fill="#0f1418" fill-opacity="0.0"/>
  <path d="M690 240 a120 120 0 1 0 0 240 a96 96 0 1 1 0 -240" fill="url(#moon)" fill-opacity="0.9"/>

  <!-- 远山层 -->
  <path d="M0 760 L150 600 L280 720 L420 560 L560 700 L700 620 L900 780 L900 900 L0 900 Z" fill="#131a18" fill-opacity="0.9"/>
  <path d="M0 820 L120 700 L240 780 L380 660 L520 760 L680 700 L820 800 L900 760 L900 900 L0 900 Z" fill="#6f906f" fill-opacity="0.35"/>

  <!-- 水面与波浪 -->
  <g stroke="#f4f1ea" stroke-opacity="0.3" stroke-width="1.6" fill="none">
    <path d="M0 880 Q40 862 80 880 T160 880 T240 880 T320 880 T400 880 T480 880 T560 880 T640 880 T720 880 T800 880 T880 880"/>
    <path d="M0 930 Q45 912 90 930 T180 930 T270 930 T360 930 T450 930 T540 930 T630 930 T720 930 T810 930 T900 930" stroke-opacity="0.18"/>
  </g>

  <!-- 泳道 -->
  <g stroke="#f4f1ea" stroke-opacity="0.14" stroke-width="1.4" stroke-dasharray="2 14">
    <line x1="0" y1="1020" x2="900" y2="1020"/>
  </g>

  <!-- 羽毛球拍 -->
  <g transform="translate(210 1000) rotate(-24)" fill="none">
    <ellipse cx="0" cy="-30" rx="52" ry="66" stroke="#ffd9b3" stroke-opacity="0.85" stroke-width="3"/>
    <ellipse cx="0" cy="-30" rx="40" ry="52" stroke="#ffd9b3" stroke-opacity="0.3" stroke-width="1"/>
    <path d="M0 -30 V110" stroke="#ffd9b3" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 幽灵编号 -->
  <text x="760" y="1090" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="300" font-weight="700" fill="#f4f1ea" fill-opacity="0.055">04</text>

  <!-- 发丝框 -->
  <rect x="36" y="36" width="828" height="1128" fill="none" stroke="#f4f1ea" stroke-opacity="0.16" stroke-width="1"/>
  <g stroke="#f4f1ea" stroke-opacity="0.6" stroke-width="2">
    <path d="M36 68 L68 36"/><path d="M864 68 L832 36"/>
    <path d="M36 1132 L68 1164"/><path d="M864 1132 L832 1164"/>
  </g>

  <rect width="900" height="1200" filter="url(#grain)"/>
</svg>
